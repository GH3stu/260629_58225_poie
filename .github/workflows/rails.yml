name: Rails CI/CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          HOST_NAME: ${{ secrets.HOST_NAME }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOST_NAME} '
            export RAILS_MASTER_KEY=${RAILS_MASTER_KEY}

            cd ~/environment/poie

            git pull origin main

            ~/.rbenv/shims/bundle install --without development test
            RAILS_ENV=production ~/.rbenv/shims/bundle exec rails db:create

            RAILS_ENV=production ~/.rbenv/shims/bundle exec rails assets:precompile
            RAILS_ENV=production ~/.rbenv/shims/bundle exec rails db:migrate
          '
